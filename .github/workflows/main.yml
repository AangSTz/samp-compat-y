name: Update Submodule URL

on:
  workflow_dispatch:
    inputs:
      submodule_path:
        description: 'Pilih submodule yang ingin diubah URL-nya'
        required: true
        type: choice
        options:
          - lib/cmake-modules
          - lib/samp-plugin-sdk
          - lib/subhook
      new_url:
        description: 'URL repositori baru'
        required: true
        type: string

jobs:
  update-url:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update URL in .gitmodules
        run: |
          git config --file=.gitmodules submodule.${{ github.event.inputs.submodule_path }}.url "${{ github.event.inputs.new_url }}"
          git submodule sync

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .gitmodules
          git commit -m "chore: update url for ${{ github.event.inputs.submodule_path }}" || echo "URL sama, tidak ada yang diubah."
          git push origin master
