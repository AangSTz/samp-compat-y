name: Build Plugin

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:   # tombol "Run workflow" manual di tab Actions

jobs:
  build-windows:
    # windows-latest sejak Juni 2026 memakai Visual Studio 2026.
    # Kode plugin lama lebih aman di VS 2022, jadi dipin ke windows-2022.
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        # Submodule sengaja tidak diambil: commit yang di-pin repo sudah hilang dari remote.

      - name: Ambil dependensi (pengganti submodule)
        shell: bash
        run: |
          rm -rf lib/cmake-modules lib/samp-plugin-sdk lib/subhook
          git clone --depth 1 https://github.com/samp-forks/cmake-modules lib/cmake-modules
          git clone --depth 1 https://github.com/udan11/samp-plugin-sdk lib/samp-plugin-sdk
          git clone --depth 1 https://github.com/BangL/subhook lib/subhook

      - name: Configure CMake (Windows 32-bit)
        run: cmake -B build -A Win32 -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build Plugin
        run: cmake --build build --config Release

      - name: Upload Artifact Windows
        uses: actions/upload-artifact@v7
        with:
          name: plugin-windows
          # CMakeLists.txt memaksa output ke test/plugins
          path: test/plugins/**/*.dll
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        # Submodule sengaja tidak diambil: commit yang di-pin repo sudah hilang dari remote.

      - name: Ambil dependensi (pengganti submodule)
        shell: bash
        run: |
          rm -rf lib/cmake-modules lib/samp-plugin-sdk lib/subhook
          git clone --depth 1 https://github.com/samp-forks/cmake-modules lib/cmake-modules
          git clone --depth 1 https://github.com/udan11/samp-plugin-sdk lib/samp-plugin-sdk
          git clone --depth 1 https://github.com/BangL/subhook lib/subhook

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Configure CMake (Linux 32-bit)
        # -m32 sudah diatur di CMakeLists.txt. Build type harus diset saat configure
        # karena generator Makefile mengabaikan --config.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build Plugin
        run: cmake --build build

      - name: Upload Artifact Linux
        uses: actions/upload-artifact@v7
        with:
          name: plugin-linux
          path: test/plugins/**/*.so
          if-no-files-found: error
